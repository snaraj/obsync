# Secret-scan configuration.
#
# The default gitleaks rule set is used WHOLE -- `useDefault = true` below --
# and nothing here disables, edits, or narrows a rule. The only entry is one
# path allowlist, for one file, with the reason written down. That is the
# entire mechanism: requirement 11 says no credential enters this repository,
# and a scan configuration is the last place that promise should be quietly
# renegotiated.
#
# WHY THIS FILE EXISTS AT ALL. `plugin/test/fixtures/crypto.json` is the
# cross-implementation vector file: the contract that makes the plugin's
# WebCrypto path and the Rust core agree on every byte (AGENTS.md, "Testing
# doctrine"). It is generated by `plugin/test/fixtures/generate.mjs` from
# VISIBLE SENTINEL inputs -- the vault root key in it is the bytes 00 01 02 …
# 1f, and every other value in the file is a deterministic HKDF or AES-GCM
# derivation of that counting sequence. Anyone can reproduce the whole file
# from the generator in one command; there is nothing in it to steal.
#
# gitleaks' `generic-api-key` heuristic sees long hex strings beside keys named
# `vrk`, `domain_key` and `manifest_key` and flags six of them. That is the
# heuristic working correctly on a file whose whole purpose is to look like key
# material, and it is a verified false positive rather than a judgement call:
# the values are checked against the generator, not taken on trust.
#
# WHAT THIS DELIBERATELY DOES NOT DO. It does not allowlist the fixtures
# DIRECTORY, and it does not allowlist a rule globally. One file is named, so a
# second fixture -- or anything else anyone drops beside it -- is scanned with
# the full default rule set and must earn its own reviewed line here. The path
# is stable across a rebase, which a commit-scoped fingerprint would not be,
# and it says WHICH file is exempt rather than which commit somebody was
# working on.

title = "obsync"

[extend]
useDefault = true

[[allowlists]]
description = "Sentinel-derived cross-implementation crypto vectors, regenerable from plugin/test/fixtures/generate.mjs; the root input is the byte sequence 00..1f and every other value derives from it."
paths = ['''^plugin/test/fixtures/crypto\.json$''']
