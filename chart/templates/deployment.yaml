apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "obsync.labels" . | nindent 4 }}
  annotations:
    platform.snaraj.dev/deployment-ready: {{ .Values.deploymentReady | quote }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    {{- /* The volumes are ReadWriteOnce and the journal has exactly one
    writer, so a surge pod could neither bind them nor be allowed to. Recreate
    stops the old pod before the new one starts, which is the only correct
    rollout for this workload rather than a tuning preference. */}}
    type: Recreate
  selector:
    matchLabels:
      {{- include "obsync.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "obsync.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: obsync
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: {{ .Values.securityContext.seccompProfile }}
      containers:
        - name: obsync
          {{- /* repository:tag@digest. The digest is what Kubernetes resolves
          and what cosign verifies; the tag is legibility only and is never a
          substitute for it. Both are required by the values schema, so a chart
          that dropped the digest cannot render. */}}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
          env:
            {{- /* Every variable in docs/architecture.md section 9 that this
            deployment decides is rendered UNCONDITIONALLY, so an operator reads
            the deployed decision straight off the manifest instead of
            discovering that a block was omitted. */}}
            - name: OBSYNC_LISTEN
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: OBSYNC_BLOBS_DIR
              value: /data/blobs
            - name: OBSYNC_JOURNAL_DIR
              value: /data/journal
            - name: OBSYNC_BLOBS_MIRRORS
              value: {{ include "obsync.mirrorPaths" . | quote }}
            {{- /* The standard library exposes no statvfs, so free space is
            capacity MINUS tracked usage and the capacity has to be declared
            (docs/architecture.md section 9). It is rendered from the CLAIM
            SIZE, not from the provisioned volume capacity, and the difference
            matters in exactly one direction: a volume grown to 500Gi behind a
            claim still requesting 250Gi can only ever hand this pod 250Gi, so
            telling the server the larger number would make the free-space
            watermark fire late -- the failure that ends in a full disk. The
            annotation on the claim records the provisioned capacity for the
            operator; this variable records what the claim guarantees. */}}
            - name: OBSYNC_BLOBS_CAPACITY
              value: {{ .Values.storage.blobs.size | quote }}
            - name: OBSYNC_JOURNAL_CAPACITY
              value: {{ .Values.storage.journal.size | quote }}
            {{- /* Display labels only: the dashboard names the class an
            operator provisioned, and the server assumes nothing whatever about
            what is behind the path (docs/storage.md). */}}
            - name: OBSYNC_BLOBS_CLASS
              value: {{ .Values.storage.blobs.className | quote }}
            - name: OBSYNC_JOURNAL_CLASS
              value: {{ .Values.storage.journal.className | quote }}
            - name: OBSYNC_DASHBOARD_DIR
              value: /opt/obsync/dashboard
            - name: OBSYNC_PLUGIN_DIR
              value: /opt/obsync/plugin
            - name: OBSYNC_EDGE
              value: {{ .Values.edge.mode | quote }}
            - name: OBSYNC_TRUSTED_PROXY_CIDRS
              value: {{ join "," .Values.trustedProxyCidrs | quote }}
            - name: OBSYNC_PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            - name: OBSYNC_RETENTION_DAYS
              value: {{ .Values.retention.days | quote }}
            - name: OBSYNC_RETENTION_VERSIONS
              value: {{ .Values.retention.versions | quote }}
            - name: OBSYNC_SCRUB_RATE
              value: {{ .Values.scrubRate | quote }}
            {{- /* Never a literal and never optional: the server key wraps
            every device secret, so a pod that started without it would
            generate a second key and orphan every paired device. A missing
            Secret must keep the pod from starting, which is what a
            non-optional secretKeyRef does. */}}
            - name: OBSYNC_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serverKeySecret.name }}
                  key: {{ .Values.serverKeySecret.key }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 60
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            {{- /* Requirement 7: readiness reflects real serving ability --
            volumes writable, journal replayed, not shutting down. The probe
            path is fixed here because a configurable health path is a
            configurable way to lie about health. */}}
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
                - {{ .Values.securityContext.dropCapabilities }}
          volumeMounts:
            {{- /* The only two mounts a default render carries, and both are
            writable claims: every chunk and every journal frame is fsynced
            through them before a response is acknowledged (docs/storage.md).
            There is no emptyDir and no /tmp -- in-flight uploads live under
            <blobs>/v1/tmp, on the same volume as the chunk they become, so the
            rename that publishes them cannot cross a filesystem. */}}
            - name: blobs
              mountPath: /data/blobs
            - name: journal
              mountPath: /data/journal
            {{- range .Values.storage.mirrors }}
            - name: mirror-{{ .name }}
              mountPath: /data/mirrors/{{ .name }}
            {{- end }}
      volumes:
        - name: blobs
          persistentVolumeClaim:
            claimName: obsync-blobs
        - name: journal
          persistentVolumeClaim:
            claimName: obsync-journal
        {{- range .Values.storage.mirrors }}
        - name: mirror-{{ .name }}
          persistentVolumeClaim:
            claimName: obsync-mirror-{{ .name }}
        {{- end }}
