apiVersion: v1
kind: ServiceAccount
metadata:
  name: obsync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "obsync.labels" . | nindent 4 }}
{{- /* The workload never talks to the API server, so it is given no token to
talk with. Declared on the ServiceAccount AND on the pod spec: neither is
redundant, because a pod may opt back in and an account may be reused. */}}
automountServiceAccountToken: false
