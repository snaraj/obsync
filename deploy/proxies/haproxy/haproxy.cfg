# obsync behind HAProxy. This one speaks the RFC 7239 `Forwarded` header
# rather than X-Forwarded-For, which the server reads the same way.
global
    log stdout format raw local0 warning
    # `crt /tls/tls.crt` finds its key in /tls/tls.key.
    ssl-load-extra-del-ext

defaults
    mode http
    log global
    timeout connect 5s
    timeout http-request 10s
    # HAProxy's common 30 s server timeout ends the change feed's 55 s long
    # poll early; both directions get room above it.
    timeout client 120s
    timeout server 120s

frontend https
    bind :8443 ssl crt /tls/tls.crt
    # Whatever a client wrote is removed before HAProxy adds its own.
    http-request del-header forwarded
    http-request del-header x-forwarded-for
    default_backend obsync

backend obsync
    option forwarded proto for
    server obsync obsync:8080
