# obsync behind nginx, run unprivileged on a read-only root: every path nginx
# writes is under /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Files of any size take one path: no body ceiling (the stock one is
        # 1 MiB), and the body streams through instead of spooling to disk.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;

        location / {
            proxy_pass http://obsync:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            # Replaced, never appended to: the address that connected here is
            # the only one this proxy can vouch for. A client's `Forwarded`
            # header is removed for the same reason.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            # The change feed holds a request open for up to 55 seconds; the
            # stock 60 s leaves no margin.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
