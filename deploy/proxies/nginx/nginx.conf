# obsync behind nginx, run unprivileged on a read-only root: every path nginx
# writes is under /tmp. Proven in CI on nginx 1.24, Ubuntu 24.04 LTS's own,
# and on the image deploy/proxies/compose.yml pins.
worker_processes 1;
pid /tmp/nginx.pid;
# nginx's own standard error, which it holds open and never reopens: the
# container's log here, the journal under systemd. `/dev/stderr` is a file
# nginx would open, and under systemd it is a socket that cannot be opened,
# at start or on `nginx -s reopen`.
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        # `http2` on the listen line is the spelling nginx 1.24 knows. From
        # 1.25.1 it still works, with a warning at start that `http2 on;`
        # replaces it; 1.24 refuses `http2 on;` outright.
        listen 8443 ssl http2;
        ssl_certificate /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Files of any size take one path: no body ceiling (the stock one is
        # 1 MiB), and the body streams through instead of spooling to disk.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;

        location / {
            proxy_pass http://obsync:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            # Replaced, never appended to: the address that connected here is
            # the only one this proxy can vouch for. A client's `Forwarded`
            # header is removed for the same reason.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            # The change feed holds a request open for up to 55 seconds; the
            # stock 60 s leaves no margin.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
