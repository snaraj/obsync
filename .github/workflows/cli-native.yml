name: CLI native acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  native:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'
          check-latest: false
      - name: Match runtime to the independently verified Node distribution
        shell: bash
        run: python3 scripts/ci/cli-runtime-bytes.py
      - name: Build shared package with exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v26.10.0
          test "$(npm --version)" = 11.19.1
          npm ci --prefix plugin --ignore-scripts --no-audit --no-fund
          node cli/build.mjs
      - name: Exercise native process, durability, installation and deferred-capability behavior
        shell: bash
        run: node cli/test.mjs
      - name: Measure actual installed POSIX startup
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/ci/cli-posix-startup.py --runtime "$(command -v node)"
      - name: Verify Windows ordinary-user custody and public CLI behavior
        if: runner.os == 'Windows'
        shell: powershell
        run: '& scripts/ci/cli-windows-native.ps1'
