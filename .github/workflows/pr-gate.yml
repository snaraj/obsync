name: PR gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # PR synchronizations may cancel an older run for the same PR. Every main
  # push instead uses its unique run id, so a later merge can never erase the
  # successful-CI event that publishes an earlier merge.
  group: pr-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # AGENTS.md requirement 9: the ratchet-only Rust line coverage floor,
  # measured by scripts/ci/coverage.sh with the pinned llvm-tools component and
  # no crate. 89, set at the first measured value on the composed bootstrap
  # wave (89.80 %, 2026-09-07). Raise it as coverage grows; lowering it weakens
  # an enforced check and is out of policy. This number, the Makefile's, and
  # AGENTS.md's are ONE fact about ONE measurement, and
  # scripts/ci/test_coverage_floor.py fails the gate if the three disagree.
  RUST_COVERAGE_FLOOR: '89'

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test the hostile contract suites
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Enforce the commit identity, trailer, and signature contract
        # `gitleaks git` and `gitleaks dir` both read BLOB content, so commit
        # AUTHOR/COMMITTER identity and message bodies have no coverage from
        # either scan. This step closes that gap for the range this event
        # actually contributes -- never all of history, which would
        # re-litigate the root commit on every run.
        if: github.event_name != 'workflow_dispatch'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          elif [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF}" = refs/heads/main ]; then
            base_sha="${PUSH_BASE_SHA}"
            head_sha="${PUSH_HEAD_SHA}"
            test "${head_sha}" = "${GITHUB_SHA}"
          else
            printf 'unsupported identity-gate event %s on %s\n' "${GITHUB_EVENT_NAME}" "${GITHUB_REF}" >&2
            exit 1
          fi
          python3 -B scripts/ci/commit_identity_contract.py \
            --repository . --base "${base_sha}" --head "${head_sha}"
      - name: Enforce one exact patch from the protected base
        # The seven lockstep locks (docs/release.md), walked over every commit
        # in the range this event contributes. Two verdicts and no flag.
        if: github.event_name != 'workflow_dispatch'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
            first_parent=()
          elif [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF}" = refs/heads/main ]; then
            base_sha="${PUSH_BASE_SHA}"
            head_sha="${PUSH_HEAD_SHA}"
            test "${head_sha}" = "${GITHUB_SHA}"
            first_parent=(--first-parent)
          else
            printf 'unsupported release-gate event %s on %s\n' "${GITHUB_EVENT_NAME}" "${GITHUB_REF}" >&2
            exit 1
          fi
          verdict="${RUNNER_TEMP}/transition-verdict.json"
          python3 -B scripts/ci/release_contract.py transition \
            --repository . --base "${base_sha}" --head "${head_sha}" \
            "${first_parent[@]}" | tee "${verdict}"
          jq -er 'if .class == "artifact" or .class == "no-artifact" then .class else error("unknown transition class") end' \
            "${verdict}"
      - name: Publish the transition verdict for the release orchestrator
        # The orchestrator must learn WHICH range this push validated -- the
        # push base is unrecoverable from git alone once later merges land --
        # so the gate's own verdict rides as a run artifact bound to this exact
        # run id. The artifact supplies the RANGE; the orchestrator re-derives
        # the classification over it from git and anchors a no-artifact verdict
        # on a base the verdict cannot choose.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transition-verdict
          path: ${{ runner.temp }}/transition-verdict.json
          if-no-files-found: error
          # A run re-attempt re-uploads under the same immutable name; without
          # overwrite the collision fails the gate and strands the merged SHA.
          overwrite: true
      - name: Install checksum-verified tools
        run: ./scripts/ci/install-tools.sh
      - name: Validate workflows
        run: actionlint
      - name: Reject high or critical source vulnerabilities
        run: >-
          trivy fs --scanners vuln
          --severity HIGH,CRITICAL --exit-code 1
          --ignore-unfixed=false --timeout 10m
          --cache-dir "${RUNNER_TEMP}/trivy-source-cache" .
      - name: Scan full history for secrets
        run: gitleaks git --no-banner --redact --max-target-megabytes=2 --verbose .
      - name: Scan working tree for secrets
        run: gitleaks dir --no-banner --redact --verbose .

  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          check-latest: false
      - name: Verify the pinned toolchain exactly
        # rust-toolchain.toml is the single Rust pin (1.98.0 with rustfmt,
        # clippy, llvm-tools); `rustup toolchain install` with no argument
        # installs exactly what that file names. The assertions below prove the
        # runner is running THAT toolchain and THAT Node, so a silently
        # upgraded runner image fails here instead of somewhere subtler.
        run: |
          set -euo pipefail
          rustup toolchain install
          test "$(rustc --version | awk '{print $2}')" = "1.98.0"
          test "$(cargo --version | awk '{print $2}')" = "1.98.0"
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Lint Rust, warnings are errors
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test the Rust workspace
        run: cargo test --workspace
      - name: Enforce the Rust coverage floor
        run: ./scripts/ci/coverage.sh
      - name: Build and test the plugin
        working-directory: plugin
        run: |
          set -euo pipefail
          test -f package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
      - name: Test the dashboard
        # The GLOB, not the directory: on the pinned Node 24.19.0 a
        # directory argument is run as a module rather than searched, so
        # `node --test dashboard/test/` fails with MODULE_NOT_FOUND.
        # Verified inside the pinned node:24.19.0-trixie-slim image.
        run: node --test dashboard/test/*.test.mjs
      - name: Pin the Makefile and CI to one battery
        run: ./scripts/ci/makefile-invariants.sh

  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-verified tools
        run: ./scripts/ci/install-tools.sh
      - name: Lint and render the chart
        run: |
          set -euo pipefail
          helm lint chart
          # The chart requires the platform's Kubernetes target (>=1.36);
          # helm template defaults to older capabilities without this flag.
          helm template smoke chart --kube-version v1.36.0 >/dev/null
      - name: Prove the rendered ingress, storage, and security pins
        run: python3 -B scripts/ci/chart_pins.py all

  container:
    # The image the release actually ships, built on every PR instead of first
    # at release time. Without this job a Dockerfile stage that cannot build,
    # an in-image test that needs the network, or a final image that stopped
    # being nonroot reaches main green and fails the PUBLISHER -- after the
    # merge, where nobody is holding the diff any more. The stages also re-run
    # batteries the `application` job already ran, in a DIFFERENT environment:
    # `cargo clippy` with warnings as errors, `cargo test --workspace --locked`
    # and `npm run build && npm test` inside a container whose only input is
    # the build context. A test that quietly
    # depends on the runner's filesystem or process environment passes there
    # and fails here, which is precisely how the two that do were found.
    #
    # NATIVE, ALWAYS. No `--platform`, no buildx builder, no QEMU: the runner
    # is amd64 and this builds amd64, so a stage failure here is a stage
    # failure and never an emulator's. The per-target arm64 image stays the
    # publisher's concern (Dockerfile header; AGENTS.md, "Build, test, and
    # release flows"), and the static-ELF step below compares the binary's
    # architecture with the RUNNER's so a cross-build cannot arrive unnoticed.
    #
    # SECRETLESS. Nothing is pushed, no registry is logged into, and the job
    # holds `contents: read`: there is no credential here to push with even if
    # a step asked to.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Point Docker at an empty configuration
        # Every base image is pulled anonymously by digest, so no credential is
        # needed. An EMPTY DOCKER_CONFIG directory has no `credsStore` entry,
        # which means no credential helper is consulted at all and a helper
        # that cannot run can never become this job's failure. Exported through
        # GITHUB_ENV rather than a job `env:` because `runner.temp` is not a
        # context a job-level environment may read.
        run: |
          set -euo pipefail
          config="${RUNNER_TEMP}/docker-empty-config"
          mkdir -p "${config}"
          printf 'DOCKER_CONFIG=%s\n' "${config}" >> "${GITHUB_ENV}"
      - name: Build the server stage natively
        run: docker build --target server --tag "obsync-gate:${GITHUB_SHA}" .
      - name: Prove the shipped binary is a static ELF for this runner
        # distroless/static has no shell, so nothing can be asked INSIDE the
        # image: `docker create` plus `docker cp` need no entrypoint, no shell
        # and no run, and the classification happens on the runner. `file` is
        # the whole verdict because `ldd` answers three different ways for a
        # static, a static-pie and a dynamic binary, and only one of those
        # three is a refusal.
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/obsyncd"
          container="$(docker create "obsync-gate:${GITHUB_SHA}")"
          docker cp "${container}:/out/obsyncd" "${binary}"
          docker rm --force "${container}" > /dev/null
          description="$(file --brief "${binary}")"
          printf 'obsyncd: %s\n' "${description}"
          case "$(uname -m)" in
            x86_64 | amd64) architecture='x86-64' ;;
            aarch64 | arm64) architecture='ARM aarch64' ;;
            *)
              printf 'DENY: unsupported runner architecture %s\n' "$(uname -m)" >&2
              exit 1
              ;;
          esac
          case "${description}" in
            *"dynamically linked"* | *interpreter*)
              printf 'DENY: obsyncd is dynamically linked: %s\n' "${description}" >&2
              exit 1
              ;;
          esac
          case "${description}" in
            *"ELF 64-bit LSB"*"${architecture}"*) ;;
            *)
              printf 'DENY: obsyncd is not a native %s ELF: %s\n' "${architecture}" "${description}" >&2
              exit 1
              ;;
          esac
          case "${description}" in
            *"statically linked"* | *"static-pie linked"*) ;;
            *)
              printf 'DENY: obsyncd declares no static linkage: %s\n' "${description}" >&2
              exit 1
              ;;
          esac
      - name: Build the full shipped image
        # Reuses the server stage cached by the build above and adds the
        # plugin, bundle and final stages, so the plugin's own npm install,
        # build and tests inside the image, and the dashboard it serves, are
        # exercised by the same job.
        run: docker build --tag "obsync-gate-full:${GITHUB_SHA}" .
      - name: Prove the image runs as nonroot with the shipped entrypoint
        # AGENTS.md, "Security invariants": the container runs as non-root and
        # has no shell. `USER nonroot` is the half of that a manifest cannot
        # add back, so it is asserted on the bytes rather than on the chart.
        run: |
          set -euo pipefail
          inspected="${RUNNER_TEMP}/obsync-image.json"
          docker image inspect "obsync-gate-full:${GITHUB_SHA}" > "${inspected}"
          jq -r '.[0].Config
                 | "user=\(.User) entrypoint=\(.Entrypoint | tostring) cmd=\(.Cmd | tostring) ports=\(.ExposedPorts | keys | tostring)"' \
            "${inspected}"
          test "$(jq -r '.[0].Config.User' "${inspected}")" = nonroot
          test "$(jq -c '.[0].Config.Entrypoint' "${inspected}")" = '["/usr/local/bin/obsyncd"]'
          test "$(jq -c '.[0].Config.Cmd' "${inspected}")" = '["serve"]'
          test "$(jq -c '.[0].Config.ExposedPorts | keys' "${inspected}")" = '["8080/tcp"]'
      - name: Prove the shipped image actually serves
        # Everything above proves the image BUILDS and that its config SAYS
        # nonroot. Neither requires it to work. This runs the bytes that were
        # just built the way README.md tells a stranger to run them -- two
        # FRESH named volumes, --read-only, no capabilities, no new privileges
        # -- and proves the server reaches ready, stays up as uid 65532, and
        # wrote a readable 64-hex setup token to the journal volume. That path
        # was broken while every static assertion in this job was green.
        run: scripts/ci/image-smoke.sh "obsync-gate-full:${GITHUB_SHA}"
      - name: Prove the provider-free install path actually serves
        # The smoke above runs the image the way a deployer with a tunnel or a
        # cluster runs it: plain HTTP on a published loopback port. That is the
        # shape Obsidian on iOS and Android REFUSES, so it says nothing about
        # the one deployment a stranger with a LAN and no accounts can finish.
        # This brings `deploy/compose` up -- the server with no published port
        # and its own digest-pinned TLS terminator -- and reaches `/readyz`
        # through real TLS, then asserts the closed ports, the trusted proxy
        # range, the setup token and both security contexts. Caddy is pulled
        # anonymously by digest with three attempts, so a Docker Hub hiccup
        # reads as a registry failure and never as an obsync defect.
        run: scripts/ci/compose-smoke.sh "obsync-gate-full:${GITHUB_SHA}"

  gate:
    # The one aggregate context the ruleset requires, listing every job by
    # name. It exists so a job that stops running -- renamed, conditioned out,
    # or removed -- turns the gate red instead of quietly leaving a required
    # check that never reports. `needs` alone is not enough: a skipped
    # dependency leaves this job skipped, and a skipped required check can
    # satisfy a ruleset, so each result is asserted explicitly.
    if: always()
    needs: [security, application, chart, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every gate job to have succeeded
        env:
          SECURITY: ${{ needs.security.result }}
          APPLICATION: ${{ needs.application.result }}
          CHART: ${{ needs.chart.result }}
          CONTAINER: ${{ needs.container.result }}
        run: |
          set -euo pipefail
          failed=0
          for entry in "security=${SECURITY}" "application=${APPLICATION}" "chart=${CHART}" "container=${CONTAINER}"; do
            printf '%-12s %s\n' "${entry%%=*}" "${entry#*=}"
            if [ "${entry#*=}" != success ]; then
              failed=1
            fi
          done
          test "${failed}" -eq 0
