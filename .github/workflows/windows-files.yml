name: Windows private filesystem acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'
          check-latest: false
      - name: Build exact embedded helper and shared adapter
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v26.10.0
          test "$(npm --version)" = 11.19.1
          npm ci --prefix plugin --ignore-scripts --no-audit --no-fund
          npm run build --prefix plugin
      - name: Prove private custody with an independent account and actual child processes
        shell: powershell
        run: ./scripts/ci/windows-files-native.ps1
