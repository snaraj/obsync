[workspace]
resolver = "3"
members = ["crates/obsync-core", "crates/obsyncd"]

[workspace.package]
version = "0.1.10"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
repository = "https://github.com/snaraj/obsync"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# `panic = "abort"` is deliberately absent: the HTTP framework isolates a
# handler panic per connection with catch_unwind (AGENTS.md requirement 7),
# which an aborting strategy would defeat.
strip = true
